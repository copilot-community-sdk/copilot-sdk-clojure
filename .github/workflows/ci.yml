name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  native:
    name: Native runtime (${{ matrix.classifier }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            classifier: native-linux-x64
            java: '17'
          - runner: macos-15
            classifier: native-darwin-arm64
            java: '21'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out certified upstream SDK
        if: runner.os == 'Linux'
        uses: actions/checkout@v6
        with:
          repository: microsoft/copilot-sdk
          ref: 5671812ecd4ce58ee040e9a41d98da2f849c8095
          path: .upstream/copilot-sdk
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: 1.12.214

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Run offline tests, examples, and built-JAR checks
        env:
          COPILOT_SDK_UPSTREAM: ${{ github.workspace }}/.upstream/copilot-sdk
          COPILOT_UPSTREAM_VALIDATION: ${{ runner.os == 'Linux' && 'true' || 'false' }}
        run: bb ci:full "${{ matrix.classifier }}"

  ci:
    needs: native
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both native platforms
        run: test "${{ needs.native.result }}" = success
